# Deploy Angular frontend in web/ to Vercel (production).
# Expects Vercel project Root Directory = web (and build overrides per docs/VERCEL_DEPLOYMENT.md).
#
# Secrets: GitHub → Settings → Environments → production → Environment secrets
#   (or repository secrets — same names). See docs/GITHUB_DEPLOYMENTS.md for where
#   to copy VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID from Vercel.
name: Deploy Frontend (Vercel)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required for secrets stored under Settings → Environments → production
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # amondnet/vercel-action errors with "Input required: vercel-token" if secrets are unset
      - name: Verify Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          err() { echo "::error::$1"; exit 1; }
          [ -n "${VERCEL_TOKEN}" ] || err "Set VERCEL_TOKEN: GitHub → Environments → production, or Actions → Repository secrets. See docs/GITHUB_DEPLOYMENTS.md"
          [ -n "${VERCEL_ORG_ID}" ] || err "Set VERCEL_ORG_ID (Vercel Team ID — docs/GITHUB_DEPLOYMENTS.md)."
          [ -n "${VERCEL_PROJECT_ID}" ] || err "Set VERCEL_PROJECT_ID (Vercel Project → Settings → General)."

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v41.1.4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
          github-comment: false
