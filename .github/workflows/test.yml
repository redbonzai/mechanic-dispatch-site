# Pull Request Validation - Runs on all PRs
# Purpose: Validate commits, check release notes, lint, build, and test
name: Pull Request Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mechanic_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mechanic_test?schema=public
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_WEBHOOK_SECRET: whsec_mock
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup NX cache
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies (API + Web)
        run: pnpm install --no-frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Verify conventional commits
        run: pnpm run commitlint:check

      - name: Semantic Release (dry run)
        run: pnpm run release:dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run database migrations
        run: pnpm prisma:migrate:deploy

      - name: Lint (NX all)
        run: pnpm exec nx run-many --target=lint --all --parallel=3

      - name: Format check
        run: pnpm format:check

      - name: Build (NX all)
        run: pnpm exec nx run-many --target=build --all --parallel=3

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Set CHROME_BIN for Karma
        run: |
          CHROME_PATH="$(which chromium-browser || which chromium || which google-chrome || which google-chrome-stable || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome/Chromium found on runner"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV

      - name: Run unit tests (NX all)
        run: pnpm exec nx run-many --target=test --all --parallel=3

      - name: Run e2e tests (API)
        run: pnpm test:e2e
