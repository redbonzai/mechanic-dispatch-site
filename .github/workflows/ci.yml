# CI Pipeline - Runs on merged code (main/develop branches)
# Purpose: Full validation, testing with coverage, and Docker image builds
name: CI

on:
  push:
    branches: [main, develop, testing-build]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mechanic_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install API dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Web dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mechanic_test?schema=public

      - name: Run database migrations
        run: pnpm prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mechanic_test?schema=public

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format --check || true

      - name: Build API
        run: pnpm build

      - name: Build Web
        working-directory: ./web
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:cov
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mechanic_test?schema=public
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_mock

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mechanic_test?schema=public
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_mock

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mechanic-dispatch-api:develop
            ${{ secrets.DOCKER_USERNAME }}/mechanic-dispatch-api:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mechanic-dispatch-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mechanic-dispatch-api:buildcache,mode=max


